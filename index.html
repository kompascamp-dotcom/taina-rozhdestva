
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080F25">
<title>Tайна Рождества — Следуй за звездой</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: #F5E8C8;
  background:
    radial-gradient(ellipse at 50% 18%, #263b60 0%, transparent 55%),
    linear-gradient(180deg, #080F25, #101a32 70%, #080F25);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

main {
  width: 100%;
  max-width: 620px;
  padding: 25px 20px 40px;
}

.language-switch {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 35px;
}

.language-switch button {
  border: 1px solid #65718a;
  border-radius: 30px;
  background: transparent;
  color: #d4d9e5;
  padding: 9px 17px;
  font-size: 14px;
  cursor: pointer;
}

.language-switch button.active {
  background: #E8BD65;
  color: #080F25;
  border-color: #E8BD65;
  font-weight: bold;
}

.star {
  color: #E8BD65;
  font-size: 82px;
  text-shadow: 0 0 35px #E8BD65;
  margin-bottom: 20px;
}

.name {
  color: #E8BD65;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  line-height: 1.8;
}

h1 {
  font-size: clamp(40px, 9vw, 66px);
  line-height: 1.08;
  margin: 23px 0 15px;
  font-weight: normal;
}

.subtitle {
  font-size: 18px;
  letter-spacing: 3px;
  color: #E8BD65;
  line-height: 1.6;
}

.description {
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.9;
  color: #d4d9e5;
  margin: 32px auto;
  max-width: 460px;
}

.notice {
  border: 1px solid #8e7548;
  background: rgba(232, 189, 101, 0.08);
  border-radius: 14px;
  padding: 23px;
  margin-top: 35px;
  font-family: Arial, sans-serif;
  line-height: 1.8;
}

.notice strong {
  color: #E8BD65;
  font-size: 17px;
}

footer {
  margin-top: 48px;
  color: #8994aa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
}

@media (max-width: 480px) {
  main { padding: 15px 5px 30px; }
  .star { font-size: 68px; }
  .language-switch { margin-bottom: 28px; }
}
</style>
</head>

<body>
<main>

  <div class="language-switch">
    <button id="etButton" onclick="setLanguage('et')">Eesti</button>
    <button id="ruButton" onclick="setLanguage('ru')">Русский</button>
  </div>

  <div class="star">✦</div>

  <div class="name" id="name"></div>

  <h1 id="title"></h1>

  <div class="subtitle" id="subtitle"></div>

  <div class="description" id="description"></div>

  <div class="notice">
    <strong id="noticeTitle"></strong>
    <br>
    <span id="noticeText"></span>
  </div>

  <footer id="footer"></footer>

</main>

<script>
const translations = {
  ru: {
    name: "Рождественский городской квест",
    title: "Тайна<br>Рождества",
    subtitle: "СЛЕДУЙ ЗА ЗВЕЗДОЙ",
    description:
      "Одна история. Один путь к Рождеству." +
      "<br><br>" +
      "Отправься в путешествие по улицам Кохтла-Ярве, " +
      "следуй за Вифлеемской звездой и открой для себя " +
      "историю самого первого Рождества.",
    noticeTitle: "Скоро начало путешествия",
    noticeText:
      "Следи за звездой. Твоя рождественская история начинается здесь.",
    footer: "KOHTLA-JÄRVE · CHRISTMAS QUEST · 2026"
  },

  et: {
    name: "Jõulude linnaseiklus",
    title: "Jõulude<br>saladus",
    subtitle: "JÄRGI TÄHTE",
    description:
      "Üks lugu. Üks tee jõuludeni." +
      "<br><br>" +
      "Alusta rännakut Kohtla-Järve tänavatel, " +
      "järgi Petlemma tähte ja avasta esimeste " +
      "jõulude lugu.",
    noticeTitle: "Teekond algab peagi",
    noticeText:
      "Järgi tähte. Sinu jõululugu algab siit.",
    footer: "KOHTLA-JÄRVE · JÕULUSEIKLUS · 2026"
  }
};

function setLanguage(language) {
  const t = translations[language];

  document.documentElement.lang = language;
  document.getElementById("name").textContent = t.name;
  document.getElementById("title").innerHTML = t.title;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("description").innerHTML = t.description;
  document.getElementById("noticeTitle").textContent = t.noticeTitle;
  document.getElementById("noticeText").textContent = t.noticeText;
  document.getElementById("footer").textContent = t.footer;

  document.getElementById("etButton").classList.toggle(
    "active", language === "et"
  );
  document.getElementById("ruButton").classList.toggle(
    "active", language === "ru"
  );

  localStorage.setItem("questLanguage", language);
}

const savedLanguage = localStorage.getItem("questLanguage");
setLanguage(savedLanguage === "et" ? "et" : "ru");
</script>

</body>
</html>
