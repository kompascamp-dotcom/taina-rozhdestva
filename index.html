
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Тайна Рождества — Следуй за звездой</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: #F5E8C8;
  background:
    radial-gradient(ellipse at 50% 18%, #263b60 0%, transparent 55%),
    linear-gradient(180deg, #080F25, #101a32 70%, #080F25);
  padding: 20px;
  text-align: center;
}

main {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  padding: 10px 5px 40px;
}

.language-switch {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 25px;
}

button {
  cursor: pointer;
  font-size: 14px;
}

.language-switch button {
  border: 1px solid #65718a;
  border-radius: 30px;
  background: transparent;
  color: #d4d9e5;
  padding: 9px 17px;
}

.language-switch button.active {
  background: #E8BD65;
  color: #080F25;
  border-color: #E8BD65;
  font-weight: bold;
}

.star {
  color: #E8BD65;
  font-size: 75px;
  text-shadow: 0 0 35px #E8BD65;
  margin-bottom: 12px;
}

.name {
  color: #E8BD65;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 1.8;
}

h1 {
  font-size: clamp(38px, 9vw, 58px);
  line-height: 1.08;
  margin: 18px 0 12px;
  font-weight: normal;
}

.subtitle {
  font-size: 16px;
  letter-spacing: 3px;
  color: #E8BD65;
  line-height: 1.6;
}

.description {
  font-family: Arial, sans-serif;
  font-size: 15px;
  line-height: 1.8;
  color: #d4d9e5;
  margin: 25px auto;
  max-width: 440px;
}

.panel {
  margin-top: 30px;
  padding: 25px 20px;
  border: 1px solid #8e7548;
  background: rgba(232, 189, 101, 0.06);
  border-radius: 16px;
  text-align: left;
}

.panel h2 {
  text-align: center;
  color: #E8BD65;
  font-weight: normal;
  margin: 0 0 22px;
  font-size: 25px;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #d4d9e5;
  font: 13px Arial, sans-serif;
}

input {
  display: block;
  width: 100%;
  padding: 13px;
  border: 1px solid #65718a;
  border-radius: 8px;
  background: #101a32;
  color: #fff;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #E8BD65;
}

.primary {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: #E8BD65;
  color: #080F25;
  font-weight: bold;
  font-size: 16px;
}

.primary:disabled {
  opacity: 0.6;
  cursor: wait;
}

.secondary {
  display: block;
  width: 100%;
  margin-top: 15px;
  padding: 10px;
  border: 0;
  background: transparent;
  color: #E8BD65;
  text-decoration: underline;
}

.message {
  margin-top: 15px;
  font: 14px/1.6 Arial, sans-serif;
  text-align: center;
  color: #f3c979;
  overflow-wrap: anywhere;
}

.hidden {
  display: none !important;
}

.welcome {
  text-align: center;
  font-family: Arial, sans-serif;
  line-height: 1.8;
  color: #d4d9e5;
}

.welcome strong {
  color: #E8BD65;
  font-size: 20px;
}

/* =================================
   PROGRESS
================================= */

.progress-section {
  margin-top: 28px;
  padding: 20px;
  background: rgba(8, 15, 37, 0.65);
  border: 1px solid #394b69;
  border-radius: 14px;
  font-family: Arial, sans-serif;
}

.progress-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 13px;
  color: #d4d9e5;
  font-size: 14px;
}

.progress-number {
  color: #E8BD65;
  font-size: 19px;
  font-weight: bold;
}

.progress-track {
  height: 9px;
  border-radius: 20px;
  background: #263550;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #bd9146, #F5D58E);
  border-radius: 20px;
  transition: width 0.4s ease;
}

/* =================================
   ADVENTURE MAP
================================= */

.adventure {
  margin-top: 30px;
  padding: 24px 15px;
  border: 1px solid #8e7548;
  border-radius: 16px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(232,189,101,0.12), transparent 65%),
    rgba(8,15,37,0.65);
}

.adventure-title {
  color: #E8BD65;
  text-align: center;
  font-size: 25px;
  font-weight: normal;
  margin: 0 0 8px;
}

.adventure-subtitle {
  font: 13px/1.7 Arial, sans-serif;
  color: #aeb9ce;
  text-align: center;
  margin: 0 auto 25px;
  max-width: 400px;
}

.stars-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.point {
  min-width: 0;
  min-height: 112px;
  border-radius: 12px;
  border: 1px solid #394b69;
  background: rgba(26, 41, 68, 0.8);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  padding: 12px 5px;
  font-family: Arial, sans-serif;
}

.point.available {
  background: linear-gradient(145deg, #f1d18b, #c99a4d);
  border: 1px solid #ffe3a7;
  box-shadow: 0 0 22px rgba(232,189,101,0.24);
  color: #101a32;
}

.point.completed {
  background: rgba(38, 83, 77, 0.55);
  border-color: #4c9b80;
  color: #9ee4c9;
}

.point.locked {
  color: #75829a;
}

.point-symbol {
  font-size: 31px;
  line-height: 1.2;
}

.point-number {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 1px;
}

.point-status {
  font-size: 10px;
  text-align: center;
}

.point-legend {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 22px;
  font: 11px Arial, sans-serif;
  color: #aeb9ce;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
}

.map-note {
  margin-top: 25px;
  padding: 16px;
  border: 1px solid #394b69;
  background: rgba(38,59,96,0.25);
  border-radius: 10px;
  text-align: center;
  color: #c4ccda;
  font: 13px/1.7 Arial, sans-serif;
}

.map-note strong {
  display: block;
  color: #E8BD65;
  margin-bottom: 5px;
}

footer {
  margin-top: 38px;
  color: #8994aa;
  font: 11px Arial, sans-serif;
  letter-spacing: 2px;
  line-height: 1.8;
}

@media (max-width: 480px) {
  main { padding: 5px 2px 25px; }
  .star { font-size: 65px; }
  .panel { padding: 22px 15px; }
  .adventure { padding: 20px 10px; }
  .stars-grid { gap: 8px; }
  .point { min-height: 100px; }
  .point-symbol { font-size: 27px; }
}

<main>

  <div class="language-switch">
    <button id="etButton" type="button"
      onclick="setLanguage('et')">Eesti</button>
    <button id="ruButton" type="button"
      onclick="setLanguage('ru')">Русский</button>
  </div>

  <div class="star">✦</div>
  <div class="name" id="name"></div>
  <h1 id="title"></h1>
  <div class="subtitle" id="subtitle"></div>
  <div class="description" id="description"></div>

  <!-- REGISTRATION / LOGIN -->

  <section class="panel" id="authPanel">
    <h2 id="formTitle"></h2>

    <form id="authForm">

      <div id="nameField">
        <label id="fullNameLabel" for="fullName"></label>
        <input id="fullName" type="text"
          autocomplete="name" maxlength="80">
      </div>

      <label id="emailLabel" for="email"></label>
      <input id="email" type="email"
        autocomplete="email" required>

      <label id="passwordLabel" for="password"></label>
      <input id="password" type="password"
        autocomplete="current-password"
        minlength="6" required>

      <div id="confirmField">
        <label id="confirmLabel" for="confirmPassword"></label>
        <input id="confirmPassword" type="password"
          autocomplete="new-password" minlength="6">
      </div>

      <button class="primary" id="submitButton"
        type="submit"></button>
    </form>

    <button class="secondary" id="switchButton"
      type="button" onclick="switchMode()"></button>

    <div class="message" id="message" role="status"></div>
  </section>


  <!-- PARTICIPANT HOME -->

  <section class="panel hidden" id="userPanel">

    <div class="welcome">
      <strong id="welcomeTitle"></strong>
      <p id="welcomeText"></p>
      <p id="userEmail"></p>
    </div>

    <!-- PROGRESS -->

    <div class="progress-section">

      <div class="progress-heading">
        <span id="progressLabel"></span>
        <span class="progress-number" id="progressNumber">
          0 / 15
        </span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

    </div>

    <!-- ADVENTURE MAP -->

    <section class="adventure">

      <h2 class="adventure-title" id="adventureTitle"></h2>

      <p class="adventure-subtitle" id="adventureSubtitle"></p>

      <div class="stars-grid" id="starsGrid"></div>

      <div class="point-legend">

        <div class="legend-item">
          <span class="legend-dot" style="background:#E8BD65"></span>
          <span id="legendAvailable"></span>
        </div>

        <div class="legend-item">
          <span class="legend-dot" style="background:#4c9b80"></span>
          <span id="legendCompleted"></span>
        </div>

        <div class="legend-item">
          <span class="legend-dot" style="background:#75829a"></span>
          <span id="legendLocked"></span>
        </div>

      </div>

      <div class="map-note">
        <strong id="mapNoteTitle"></strong>
        <span id="mapNoteText"></span>
      </div>

    </section>

    <button class="primary" id="logoutButton"
      type="button" onclick="logout()"></button>

    <div class="message" id="userMessage"></div>

  </section>

  <footer id="footer"></footer>

</main>

// ========================================
// 4. LANGUAGE SWITCHING
// ========================================

function setLanguage(language) {

  currentLanguage = language;

  const t = translations[language];

  document.documentElement.lang = language;

  document.getElementById('name').textContent = t.name;
  document.getElementById('title').innerHTML = t.title;
  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('description').innerHTML = t.description;
  document.getElementById('footer').textContent = t.footer;

  document.getElementById('etButton')
    .classList.toggle('active', language === 'et');

  document.getElementById('ruButton')
    .classList.toggle('active', language === 'ru');

  document.getElementById('fullNameLabel').textContent = t.fullName;
  document.getElementById('emailLabel').textContent = t.email;
  document.getElementById('passwordLabel').textContent = t.password;
  document.getElementById('confirmLabel').textContent = t.confirm;

  document.getElementById('progressLabel').textContent = t.progress;
  document.getElementById('adventureTitle').textContent = t.adventureTitle;
  document.getElementById('adventureSubtitle').textContent = t.adventureSubtitle;

  document.getElementById('legendAvailable').textContent = t.available;
  document.getElementById('legendCompleted').textContent = t.completed;
  document.getElementById('legendLocked').textContent = t.locked;

  document.getElementById('mapNoteTitle').textContent = t.mapNoteTitle;
  document.getElementById('mapNoteText').textContent = t.mapNoteText;

  document.getElementById('logoutButton').textContent = t.logout;

  updateModeText();

  if (currentUserData) {
    renderParticipantHome();
  }

  localStorage.setItem('questLanguage', language);
}


// ========================================
// 5. REGISTRATION / LOGIN MODE
// ========================================

function updateModeText() {

  const t = translations[currentLanguage];

  document.getElementById('formTitle').textContent =
    mode === 'register' ? t.register : t.login;

  document.getElementById('submitButton').textContent =
    mode === 'register' ? t.create : t.enter;

  document.getElementById('switchButton').textContent =
    mode === 'register' ? t.switchLogin : t.switchRegister;

  document.getElementById('nameField')
    .classList.toggle('hidden', mode !== 'register');

  document.getElementById('confirmField')
    .classList.toggle('hidden', mode !== 'register');

  document.getElementById('fullName').required =
    mode === 'register';

  document.getElementById('confirmPassword').required =
    mode === 'register';

  document.getElementById('password').autocomplete =
    mode === 'register' ? 'new-password' : 'current-password';

  document.getElementById('message').textContent = '';
}


function switchMode() {

  mode = mode === 'register' ? 'login' : 'register';

  document.getElementById('authForm').reset();

  updateModeText();
}


// ========================================
// 6. ERROR HANDLING
// ========================================

function showError(error) {

  console.error('Firebase error:', error);

  const code = error.code || 'unknown';

  const t = translations[currentLanguage];

  const translated =
    t.errors[code] || t.errors.default;

  document.getElementById('message').textContent =
    'Ошибка: ' + code + ' — ' + translated;
}


// ========================================
// 7. REGISTRATION AND LOGIN
// ========================================

document.getElementById('authForm')
  .addEventListener('submit', async function(event) {

    event.preventDefault();

    const t = translations[currentLanguage];

    const email =
      document.getElementById('email').value.trim();

    const password =
      document.getElementById('password').value;

    const button =
      document.getElementById('submitButton');

    button.disabled = true;

    document.getElementById('message').textContent = '';

    try {

      if (mode === 'register') {

        const fullName =
          document.getElementById('fullName').value.trim();

        const confirmPassword =
          document.getElementById('confirmPassword').value;

        if (fullName.length < 2) {
          document.getElementById('message').textContent =
            t.nameRequired;
          return;
        }

        if (password !== confirmPassword) {
          document.getElementById('message').textContent =
            t.passwordMismatch;
          return;
        }

        const credential =
          await auth.createUserWithEmailAndPassword(
            email,
            password
          );

        await db.collection('users')
          .doc(credential.user.uid)
          .set({

            fullName: fullName,

            email: credential.user.email,

            language: currentLanguage,

            completedPoints: 0,

            createdAt:
              firebase.firestore.FieldValue.serverTimestamp()

          });

        console.log('Registration successful');

      } else {

        await auth.signInWithEmailAndPassword(
          email,
          password
        );

        console.log('Login successful');

      }

    } catch (error) {

      showError(error);

    } finally {

      button.disabled = false;

    }

  });


// ========================================

function renderParticipantHome() {

  const t = translations[currentLanguage];

  const userData = currentUserData || {};

  const completed = Math.min(
    15,
    Math.max(0, Number(userData.completedPoints) || 0)
  );

  const percentage = (completed / 15) * 100;

  // Прогресс

  document.getElementById('progressNumber').textContent =
    completed + ' / 15';

  document.getElementById('progressFill').style.width =
    percentage + '%';

  // Приветствие

  const fullName = userData.fullName || '';

  document.getElementById('welcomeTitle').textContent =
    t.welcome + (fullName ? ' ' + fullName : '');

  document.getElementById('welcomeText').textContent =
    t.welcomeText;

  // Звёзды маршрута

  const grid = document.getElementById('starsGrid');

  grid.innerHTML = '';

  for (let i = 1; i <= 15; i++) {

    const point = document.createElement('div');

    point.className = 'point';

    const number = String(i).padStart(2, '0');

    let symbol = '✧';
    let status = t.locked;
    let state = 'locked';

    if (i <= completed) {

      symbol = '✦';
      status = t.completed;
      state = 'completed';

    } else if (i === completed + 1) {

      symbol = '✦';
      status = t.available;
      state = 'available';

    }

    point.classList.add(state);

    const star = document.createElement('div');
    star.className = 'point-symbol';
    star.textContent = symbol;

    const pointNumber = document.createElement('div');
    pointNumber.className = 'point-number';
    pointNumber.textContent = number;

    const pointStatus = document.createElement('div');
    pointStatus.className = 'point-status';
    pointStatus.textContent = status;

    point.appendChild(star);
    point.appendChild(pointNumber);
    point.appendChild(pointStatus);

    grid.appendChild(point);

  }

}


// ========================================
// 9. CHECK AUTHENTICATION STATE
// ========================================

auth.onAuthStateChanged(async function(user) {

  const authPanel =
    document.getElementById('authPanel');

  const userPanel =
    document.getElementById('userPanel');

  const userMessage =
    document.getElementById('userMessage');

  userMessage.textContent = '';

  currentUserData = null;

  if (!user) {

    authPanel.classList.remove('hidden');

    userPanel.classList.add('hidden');

    return;

  }

  try {

    const doc =
      await db.collection('users')
        .doc(user.uid)
        .get();

    if (!doc.exists) {

      userMessage.textContent =
        translations[currentLanguage].accountCreated;

      currentUserData = {
        fullName: user.displayName || '',
        completedPoints: 0
      };

    } else {

      currentUserData = doc.data();

    }

    document.getElementById('userEmail').textContent =
      user.email || '';

    renderParticipantHome();

    authPanel.classList.add('hidden');

    userPanel.classList.remove('hidden');

  } catch (error) {

    console.error('Profile loading error:', error);

    userMessage.textContent =
      'Ошибка загрузки профиля: ' +
      (error.code || error.message);

    authPanel.classList.add('hidden');

    userPanel.classList.remove('hidden');

  }

});


// ========================================
// 10. LOGOUT
// ========================================

async function logout() {

  try {

    await auth.signOut();

  } catch (error) {

    showError(error);

  }

}

setLanguage(
