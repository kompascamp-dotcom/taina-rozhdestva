{
ref:'Луки 1:26–38',bible:'Luke 1:26-38',
ru:{title:'Весть для Марии',story:'Когда Елисавета была уже на шестом месяце беременности, Бог послал ангела Гавриила в город Назарет, к молодой девушке по имени Мария. Она была обручена с Иосифом, происходившим из рода Давида.\\n\\nАнгел вошёл к Марии и приветствовал её словами о том, что Господь с ней. Мария смутилась и не понимала, что означает это приветствие. Гавриил объяснил: она родит Сына и назовёт Его Иисусом. Он будет велик и назовётся Сыном Всевышнего.\\n\\nМария спросила, как это произойдёт, ведь она не знает мужа. Ангел ответил, что Дух Святой сойдёт на неё и сила Всевышнего осенит её. Мария смиренно ответила, что она раба Господня и пусть будет ей по слову Божьему.',q:'Как Мария ответила на слова ангела?',a:['«Я раба Господня; да будет Мне по слову твоему»','«Я не хочу этого»','«Сначала спроси Иосифа»'],correct:0,hint:'Мария доверилась Богу и согласилась принять Его волю.',explain:'Мария ответила с верой и смирением. Она не знала всех подробностей будущего, но доверилась Богу.'},
et:{title:'Sõnum Maarjale',story:'Kui Eliisabet oli kuuendat kuud lapseootel, saatis Jumal ingel Gabrieli Naatsaretti noore neiu Maarja juurde. Maarja oli kihlatud Joosepiga, kes pärines Taaveti soost.\\n\\nIngel tervitas Maarjat ja ütles, et Issand on temaga. Maarja ehmus ega mõistnud tervituse tähendust. Gabriel selgitas, et ta sünnitab Poja ja paneb Talle nimeks Jeesus. Teda nimetatakse Kõigekõrgema Pojaks.\\n\\nMaarja küsis, kuidas see saab sündida. Ingel vastas, et Püha Vaim tuleb tema peale ja Kõigekõrgema vägi katab teda. Maarja vastas alandlikult, et ta on Issanda teenija ja sündigu temale ingli sõna järgi.',q:'Kuidas Maarja ingli sõnumile vastas?',a:['„Vaata, siin on Issanda teenija; sündigu mulle sinu sõna järgi“','„Ma ei taha seda“','„Küsi kõigepealt Joosepilt“'],correct:0,hint:'Maarja usaldas Jumalat ja nõustus Tema tahtega.',explain:'Maarja vastas usu ja alandlikkusega. Ta usaldas Jumalat ka siis, kui ei teadnud kõiki tuleviku üksikasju.'}
},
{
ref:'Луки 1:39–56',bible:'Luke 1:39-56',
ru:{title:'Радость, которую невозможно скрыть',story:'Узнав о Божьем обещании, Мария отправилась в горную местность, в город Иудин, чтобы навестить свою родственницу Елисавету.\\n\\nКогда Мария вошла в дом и поздоровалась с Елисаветой, младенец во чреве Елисаветы взыграл. Елисавета исполнилась Святого Духа и громко сказала, что Мария благословенна между женщинами и благословен плод её чрева.\\n\\nЕлисавета назвала Марию матерью Господа. Она радовалась тому, что Мария поверила словам Бога. В ответ Мария прославила Господа. Она говорила о Божьей милости, о том, что Бог помнит Своих людей и помогает смиренным. Эта встреча была наполнена радостью и благодарностью.',q:'Как Елисавета отреагировала на приход Марии?',a:['Она исполнилась Святого Духа и благословила Марию','Она рассердилась','Она не узнала Марию'],correct:0,hint:'Елисавета почувствовала особенную радость ещё до рождения ребёнка.',explain:'Елисавета исполнилась Святого Духа и назвала Марию благословенной. Она узнала, что Бог совершает великое дело.'},
et:{title:'Rõõm, mida ei saa peita',story:'Saanud teada Jumala tõotusest, läks Maarja mäestikumaale Juuda linna oma sugulase Eliisabeti juurde.\\n\\nKui Maarja tervitas Eliisabetti, hüppas laps Eliisabeti ihus. Eliisabet täitus Püha Vaimuga ja hüüdis, et Maarja on õnnistatud naiste seas ja õnnistatud on tema ihu vili.\\n\\nEliisabet nimetas Maarjat oma Issanda emaks. Ta rõõmustas, et Maarja uskus Jumala sõnu. Maarja vastas Jumalat kiites. Ta rääkis Jumala halastusest ja sellest, et Jumal hoolitseb alandlike eest.',q:'Kuidas Eliisabet Maarja saabumisele reageeris?',a:['Ta täitus Püha Vaimuga ja õnnistas Maarjat','Ta vihastas','Ta ei tundnud Maarjat ära'],correct:0,hint:'Eliisabet tundis erilist rõõmu juba enne lapse sündi.',explain:'Eliisabet täitus Püha Vaimuga ja nimetas Maarjat õnnistatuks.'}
},
{
ref:'Матфея 1:18–25',bible:'Matthew 1:18-25',
ru:{title:'Сон, изменивший решение',story:'Мария была обручена с Иосифом. Когда выяснилось, что она ожидает ребёнка от Святого Духа, Иосиф оказался перед трудным решением. Он был праведным человеком и не хотел опозорить Марию, поэтому решил тайно отпустить её.\\n\\nНо когда он обдумывал это, ему во сне явился ангел Господень. Ангел сказал: «Иосиф, сын Давидов! не бойся принять Марию, жену твою, ибо родившееся в Ней есть от Духа Святого».\\n\\nАнгел также объяснил, что Мария родит Сына, и Иосиф должен назвать Его Иисусом, потому что Он спасёт людей от их грехов. Проснувшись, Иосиф поступил так, как велел ему ангел, и принял Марию.',q:'Что ангел объяснил Иосифу во сне?',a:['Что Мария должна уехать одна','Что ребёнок зачат от Святого Духа и Его нужно назвать Иисусом','Что Иосиф должен покинуть Назарет навсегда'],correct:1,hint:'Ангел призвал Иосифа не бояться принять Марию.',explain:'Иосифу было открыто, что ребёнок от Святого Духа и что Он спасёт людей от грехов. Иосиф послушался Бога.'},
et:{title:'Unenägu, mis muutis otsust',story:'Maarja oli kihlatud Joosepiga. Kui selgus, et ta ootab last Pühast Vaimust, seisis Joosep raske otsuse ees. Ta oli õiglane ega tahtnud Maarjat häbistada ning kavatses ta salaja vabaks lasta.\\n\\nKui ta seda mõtles, ilmus talle unes Issanda ingel. Ingel ütles: „Joosep, Taaveti poeg, ära karda Maarjat, oma naist, enese juurde võtta, sest see, kes temas on sündinud, on Pühast Vaimust.”\\n\\nIngel ütles ka, et Maarja sünnitab Poja ja Joosep peab panema Talle nimeks Jeesus, sest Tema päästab oma rahva nende pattudest. Joosep tegi nii, nagu ingel oli käskinud.',q:'Mida ingel Joosepile unes selgitas?',a:['Maarja peab üksi ära minema','Laps on saadud Pühast Vaimust ja Tema nimeks tuleb panna Jeesus','Joosep peab Naatsaretist igaveseks lahkuma'],correct:1,hint:'Ingel julgustas Joosepit Maarjat enda juurde võtma.',explain:'Joosepile öeldi, et laps on Pühast Vaimust ja päästab inimesed nende pattudest.'}
},
{
ref:'Луки 2:1–3',bible:'Luke 2:1-3',
ru:{title:'Путь в Вифлеем',story:'В те дни вышло повеление от кесаря Августа сделать перепись по всей земле. Люди должны были отправиться в города, откуда происходили их семьи, чтобы записаться.\\n\\nЭто повеление изменило планы многих людей. Иосифу тоже пришлось отправиться в путь. Он жил в Назарете Галилейском, но должен был идти туда, откуда происходил его род.\\n\\nТак обычное распоряжение римского правителя стало частью истории, в которой исполнялось Божье обещание. Путь в Вифлеем был не просто путешествием — он приближал рождение Спасителя.',q:'Почему люди отправлялись в свои родные города?',a:['Чтобы праздновать свадьбу','Из-за переписи, объявленной кесарем Августом','Чтобы встретить волхвов'],correct:1,hint:'Правитель приказал пересчитать население.',explain:'Кесарь Август объявил перепись. Поэтому Иосиф отправился в город своего рода.'},
et:{title:'Teekond Petlemma',story:'Neil päevil andis keiser Augustus käsu kogu riigi rahvas üles kirjutada. Inimesed pidid minema oma päritolulinna, et end kirja panna.\\n\\nSee korraldus muutis paljude inimeste plaane. Ka Joosep pidi teele asuma. Ta elas Galilea Naatsaretis, kuid pidi minema linna, kust tema suguvõsa pärines.\\n\\nNii sai Rooma valitseja korraldus osaks loost, milles täitus Jumala tõotus. Teekond Petlemma viis Päästja sünnile lähemale.',q:'Miks inimesed pidid minema oma kodulinna?',a:['Pulmade tähistamiseks','Keiser Augustuse korraldatud rahvaloenduse tõttu','Tarkade meeste vastuvõtmiseks'],correct:1,hint:'Valitseja käskis rahva üle lugeda.',explain:'Keiser Augustus korraldas rahvaloenduse. Seetõttu läks Joosep oma suguvõsa linna.'}
},
{
ref:'Луки 2:4–5',bible:'Luke 2:4-5',
ru:{title:'Город Давида',story:'Иосиф отправился из Назарета в Вифлеем. Он шёл туда, потому что происходил из дома и рода Давида. Вифлеем был городом Давида, поэтому именно туда ему нужно было прийти для переписи.\\n\\nМария отправилась вместе с Иосифом. Она была обручена с ним и ожидала рождения ребёнка. Путь был непростым: им предстояло пройти большое расстояние, а время рождения уже приближалось.\\n\\nВозможно, они уставали и переживали о том, что ждёт их впереди. Но они продолжали путь. Незаметное для окружающих путешествие приближало событие, которое изменит историю мира.',q:'Почему Иосиф направился именно в Вифлеем?',a:['Потому что там жил кесарь Август','Потому что он происходил из рода Давида','Потому что там находился храм'],correct:1,hint:'Вифлеем называли городом Давида.',explain:'Иосиф принадлежал к дому и роду Давида. Поэтому он отправился в Вифлеем.'},
et:{title:'Taaveti linn',story:'Joosep läks Naatsaretist Petlemma, sest ta pärines Taaveti soost ja kojast. Petlemm oli Taaveti linn ning sinna pidi ta rahvaloenduse jaoks minema.\\n\\nMaarja läks koos Joosepiga. Ta oli temaga kihlatud ja ootas lapse sündi. Tee ei olnud kerge: ees oli pikk teekond ja sünnituse aeg lähenes.\\n\\nNad võisid olla väsinud ja muretseda tuleviku pärast. Kuid nad jätkasid teed. See tagasihoidlik teekond viis sündmuseni, mis muutis maailma ajalugu.',q:'Miks läks Joosep just Petlemma?',a:['Sest seal elas keiser Augustus','Sest ta pärines Taaveti soost','Sest seal asus tempel'],correct:1,hint:'Petlemma nimetati Taaveti linnaks.',explain:'Joosep kuulus Taaveti kotta ja suguvõssa. Seetõttu läks ta Petlemma.'}
},
{
ref:'Луки 2:6–7',bible:'Luke 2:6-7',
ru:{title:'Место для Царя',story:'Когда Иосиф и Мария находились в Вифлееме, наступило время родить Марии. Она родила Сына своего первенца, спеленала Его и положила в ясли.\\n\\nПочему в ясли? Потому что для них не нашлось места в гостинице — в доме для приезжих не было свободного места. Так Тот, Кто является Царём царей, пришёл в мир не во дворце и не среди роскоши. Его первой постелью стали ясли для животных.\\n\\nЭто удивительная часть Рождества. Бог пришёл к людям скромно и близко. Иисус родился не в богатстве, а в простоте. Его приход показывает, что Божья любовь доступна каждому человеку.',q:'Куда Мария положила новорождённого Иисуса?',a:['В царскую кроватку','В ясли, потому что не нашлось места в гостинице','На мягкий трон'],correct:1,hint:'Это было место, где обычно лежал корм для животных.',explain:'Мария спеленала Иисуса и положила Его в ясли, потому что в гостинице не было места.'},
et:{title:'Koht Kuningale',story:'Kui Joosep ja Maarja olid Petlemmas, saabus Maarja sünnitamise aeg. Ta tõi ilmale oma esimese Poja, mähkis Ta mähkmetesse ja asetas sõime.\\n\\nMiks sõime? Sest nende jaoks ei olnud majas ruumi — külaliste tuba oli täis. Nii tuli kuningate Kuningas maailma mitte palees ega luksuses. Tema esimeseks voodiks oli loomade söögisõim.\\n\\nSee on jõululoo hämmastav osa. Jumal tuli inimeste juurde alandlikult ja lähedale. Jeesus sündis lihtsuses, näidates, et Jumala armastus on iga inimese jaoks.',q:'Kuhu Maarja vastsündinud Jeesuse asetas?',a:['Kuninga hälli','Sõime, sest majas ei olnud ruumi','Pehmele troonile'],correct:1,hint:'See oli koht, kuhu pandi loomade toit.',explain:'Maarja mähkis Jeesuse ja asetas Ta sõime, sest majas ei olnud neile ruumi.'}
},
{
ref:'Луки 2:8–12',bible:'Luke 2:8-12',
ru:{title:'Знак для пастухов',story:'Недалеко от Вифлеема в поле были пастухи. Они ночью стерегли своё стадо. Вдруг перед ними предстал ангел Господень, и слава Господня осияла их. Пастухи очень испугались.\\n\\nНо ангел сказал им не бояться, потому что возвещает им великую радость для всего народа: сегодня в городе Давидовом родился Спаситель, Который есть Христос Господь.\\n\\nАнгел дал им знак, по которому они смогут узнать Младенца: они найдут Младенца в пеленах, лежащего в яслях. Это было удивительное известие. Первыми о рождении Спасителя услышали не цари и не богатые люди, а простые пастухи.',q:'Какой знак ангел дал пастухам?',a:['Младенец в царском дворце','Младенец в пеленах, лежащий в яслях','Яркая звезда над храмом'],correct:1,hint:'Вспомни, где Мария положила Иисуса.',explain:'Пастухи должны были найти Младенца в пеленах, лежащего в яслях.'},
et:{title:'Märk karjastele',story:'Petlemma lähedal olid karjased väljal oma karja valvamas. Öösel ilmus neile Issanda ingel ja Issanda kirkus säras nende ümber. Karjased ehmusid väga.\\n\\nIngel ütles, et nad ei kardaks, sest tal on neile suur rõõmusõnum: Taaveti linnas on täna sündinud Päästja, kes on Issand Kristus.\\n\\nIngel andis neile märgi: nad leiavad lapse mähkmetesse mähituna ja sõimes lamamas. See oli hämmastav uudis. Esimestena kuulsid Päästja sünnist mitte kuningad ega rikkad, vaid lihtsad karjased.',q:'Millise märgi ingel karjastele andis?',a:['Laps kuningapalees','Mähkmetesse mähitud laps sõimes','Särav täht templi kohal'],correct:1,hint:'Mõtle, kuhu Maarja Jeesuse asetas.',explain:'Karjased pidid leidma mähkmetesse mähitud lapse sõimest.'}
},
{
ref:'Луки 2:13–14',bible:'Luke 2:13-14',
ru:{title:'Небесная песня',story:'После слов ангела вдруг явилось многочисленное небесное воинство. Ангелы славили Бога и провозглашали: «Слава в вышних Богу, и на земле мир, в человеках благоволение!»\\n\\nПредставь эту ночь: тёмное поле, пастухи, стадо и вдруг небо, наполненное славой и песней. Рождение Иисуса стало причиной радости не только на земле, но и на небесах.\\n\\nАнгелы прославляли Бога за то, что Он послал Спасителя. Рождество напоминает нам о Божьем мире и Его благоволении к людям.',q:'Что прославляли ангелы?',a:['Славу Богу и мир на земле','Силу римского императора','Богатство Вифлеема'],correct:0,hint:'Их песнь начиналась словами «Слава в вышних Богу».',explain:'Ангелы славили Бога и возвещали мир на земле.'},
et:{title:'Taevane laul',story:'Pärast ingli sõnu ilmus äkitselt suur taevane väehulk. Inglid kiitsid Jumalat ja kuulutasid: „Au olgu Jumalale kõrges ja maa peal rahu!”\\n\\nKujuta ette seda ööd: pime väli, karjased ja kari ning äkitselt kirkusest täidetud taevas ja laul. Jeesuse sünd tõi rõõmu nii maa peale kui taevasse.\\n\\nInglid kiitsid Jumalat, sest Ta oli saatnud Päästja. Jõulud meenutavad meile Jumala rahu ja head tahet inimeste vastu.',q:'Mida inglid ülistasid?',a:['Jumala au ja rahu maa peal','Rooma keisri väge','Petlemma rikkust'],correct:0,hint:'Nende laul algas sõnadega „Au olgu Jumalale kõrges”.',explain:'Inglid kiitsid Jumalat ja kuulutasid rahu maa peale.'}
},
{
ref:'Луки 2:15–20',bible:'Luke 2:15-20',
ru:{title:'Они не остались на месте',story:'Когда ангелы ушли на небо, пастухи сказали друг другу: пойдём в Вифлеем и посмотрим, что там произошло и о чём возвестил нам Господь.\\n\\nОни поспешили и нашли Марию, Иосифа и Младенца, лежащего в яслях. Увидев Его, пастухи рассказали всё, что им было сказано о Ребёнке. Все, кто слышал их рассказ, удивлялись.\\n\\nМария сохраняла эти слова в своём сердце. Пастухи же вернулись, прославляя и хваля Бога за всё, что услышали и увидели. Они не оставили услышанную весть только для себя — они поделились ею с другими.',q:'Что сделали пастухи после вести ангелов?',a:['Остались на поле и забыли о ней','Поспешили в Вифлеем и нашли Младенца','Вернулись домой, не проверив'],correct:1,hint:'Они решили своими глазами увидеть то, о чём им сообщили.',explain:'Пастухи отправились в Вифлеем, нашли Иисуса и рассказали другим о случившемся.'},
et:{title:'Nad ei jäänud paigale',story:'Kui inglid olid taevasse läinud, ütlesid karjased üksteisele: lähme Petlemma ja vaatame, mis seal on sündinud ning millest Issand meile teada andis.\\n\\nNad läksid kiiresti ja leidsid Maarja, Joosepi ja sõimes lamava lapse. Kui nad Teda nägid, rääkisid nad sellest, mida neile lapse kohta oli öeldud. Kõik kuulajad imestasid.\\n\\nMaarja jättis need sõnad oma südamesse. Karjased pöördusid tagasi, ülistades ja kiites Jumalat kõige eest, mida nad olid kuulnud ja näinud. Nad jagasid head sõnumit teistega.',q:'Mida karjased pärast inglite sõnumit tegid?',a:['Jäid väljale ega mõelnud sellele enam','Läksid kiiresti Petlemma ja leidsid lapse','Läksid koju ega kontrollinud midagi'],correct:1,hint:'Nad tahtsid oma silmaga näha, millest neile räägiti.',explain:'Karjased läksid Petlemma, leidsid Jeesuse ja rääkisid teistele sellest.'}
},
{
ref:'Матфея 2:1–2',bible:'Matthew 2:1-2',
ru:{title:'Звезда на Востоке',story:'После рождения Иисуса в Вифлееме Иудейском во дни царя Ирода пришли в Иерусалим волхвы с востока. Они были мудрецами, которые наблюдали за небом и искали знаки.\\n\\nВолхвы спрашивали: где родившийся Царь Иудейский? Они увидели Его звезду на востоке и пришли поклониться Ему.\\n\\nЗвезда привела их в путь. Они не знали всех подробностей, но увиденный знак побудил их отправиться искать Царя. Рождественская история показывает, что Иисус пришёл не только для одного народа — к Нему стремились люди из далёких стран.',q:'Откуда пришли волхвы, чтобы поклониться Иисусу?',a:['С востока','Из Египта','Из Рима'],correct:0,hint:'В Евангелии говорится, что они увидели Его звезду на востоке.',explain:'Волхвы пришли с востока, увидев звезду родившегося Царя.'},

{
ref:'Матфея 2:3–8',bible:'Matthew 2:3-8',
ru:{title:'Вопрос царя',story:'Когда царь Ирод услышал о рождении Царя Иудейского, он встревожился, и весь Иерусалим вместе с ним. Ирод собрал первосвященников и книжников и спросил, где должен родиться Христос.\\n\\nОни ответили, что в Вифлееме, потому что так было написано пророком: из Вифлеема выйдет Вождь, Который будет пасти народ Божий.\\n\\nИрод тайно позвал волхвов и расспросил их о времени появления звезды. Затем он отправил их в Вифлеем и попросил внимательно разузнать о Младенце, а потом сообщить ему. Но намерения Ирода не были добрыми: он боялся потерять власть.',q:'Где, согласно пророчеству, должен был родиться Христос?',a:['В Назарете','В Иерусалиме','В Вифлееме'],correct:2,hint:'Это город, куда направлялись Иосиф и Мария.',explain:'Книжники указали на Вифлеем, ссылаясь на пророчество.'},

ru:{title:'Самый необычный подарок',story:'Выслушав царя, волхвы отправились в путь. Звезда, которую они видели на востоке, шла перед ними и остановилась над местом, где находился Младенец. Увидев звезду, они очень обрадовались.\\n\\nВойдя в дом, волхвы увидели Младенца с Марией, Его матерью, и, пав, поклонились Ему. Затем они открыли свои сокровища и принесли дары: золото, ладан и смирну.\\n\\nЭто были ценные подарки, каждый со своим значением. Но самым важным было не то, что волхвы принесли, а Кому они поклонились. Они признали в Иисусе Царя и пришли почтить Его.',q:'Какие дары принесли волхвы Иисусу?',a:['Серебро, хлеб и вино','Золото, ладан и смирну','Одежду, воду и масло'],correct:1,hint:'Вспомни три известных дара из этой истории.',explain:'Волхвы принесли золото, ладан и смирну, а прежде всего поклонились Иисусу.'},
et:{title:'Kõige erilisem kingitus',story:'Pärast kuninga kuulamist asusid tähetargad teele. Täht, mida nad olid idas näinud, käis nende eel ja jäi seisma paiga kohale, kus oli laps. Tähe nägemisest rõõmustasid nad väga.\\n\\nMajja astudes nägid nad last koos Maarja, Tema emaga. Nad kummardasid Teda ning avasid oma varandused ja tõid kingitusteks kulda, viirukit ja mürri.\\n\\nNeed olid hinnalised kingitused. Kuid kõige tähtsam ei olnud see, mida nad tõid, vaid see, kelle ette nad kummardasid. Nad tunnistasid Jeesuse Kuningaks.',q:'Millised kingitused tähetargad Jeesusele tõid?',a:['Hõbeda, leiva ja veini','Kulla, viiruki ja mürri','Riided, vee ja õli'],correct:1,hint:'Mõtle selle loo kolmele tuntud kingitusele.',explain:'Tähetargad tõid kulda, viirukit ja mürri ning kummardasid Jeesust.'}

et:{title:'Suurim armastus',story:'Oleme käinud tee iidsest tõotusest Jeesuse sünnini, karjastest tähetarkadeni. Iga lugu on meile midagi olulist näidanud. Aga miks Jumal seda kõike tegi?\\n\\nJohannese evangeeliumis on sõnad, mis selgitavad jõulude südant: „Sest nõnda on Jumal maailma armastanud, et ta oma ainusündinud Poja on andnud, et ükski, kes temasse usub, ei hukkuks, vaid et tal oleks igavene elu.”\\n\\nJeesus ei tulnud maailma lihtsalt ilusa loo väikelapsena. Ta tuli, sest Jumal armastab inimesi ja tahab neid päästa. Jõulud meenutavad meile Jumala suurimat kingitust — Tema Poega.\\n\\nOled leidnud kõik tähed. Kuid kõige suurem aare on Jumala armastuse tundmine ja sellele vastamine.',q:'Miks saatis Jumal oma Poja maailma?',a:['Et inimesed ehitaksid Talle palee','Et saada maiseks valitsejaks','Sest Jumal armastas maailma ja tahab inimesi päästa'],correct:2,hint:'Vastus algab sõnadega: „Sest nõnda on Jumal maailma armastanud…”',explain:'Jumal saatis Jeesuse armastusest inimeste vastu, et uskujatel oleks igavene elu.'}

// ============================================
// ЯЗЫК
// ============================================
function setLanguage(lang){
currentLanguage=lang;
localStorage.setItem('questLanguage',lang);
const t=T[lang];
document.documentElement.lang=lang;
document.getElementById('name').textContent=t.name;
document.getElementById('title').innerHTML=t.title;
document.getElementById('subtitle').textContent=t.subtitle;
document.getElementById('description').innerHTML=t.description;
document.getElementById('footer').textContent=t.footer;
document.getElementById('etButton').classList.toggle('active',lang==='et');
document.getElementById('ruButton').classList.toggle('active',lang==='ru');
document.getElementById('formTitle').textContent=mode==='register'?t.register:t.login;
document.getElementById('fullNameLabel').textContent=t.fullName;
document.getElementById('emailLabel').textContent=t.email;
document.getElementById('passwordLabel').textContent=t.password;
document.getElementById('confirmLabel').textContent=t.confirm;
document.getElementById('submitButton').textContent=mode==='register'?t.create:t.enter;
document.getElementById('switchButton').textContent=mode==='register'?t.switchLogin:t.switchRegister;
document.getElementById('nameField').classList.toggle('hidden',mode!=='register');
document.getElementById('confirmField').classList.toggle('hidden',mode!=='register');
document.getElementById('welcomeText').textContent=t.welcomeText;
document.getElementById('progressLabel').textContent=t.progress;
document.getElementById('adventureTitle').textContent=t.adventureTitle;
document.getElementById('adventureSubtitle').textContent=t.adventureSubtitle;
document.getElementById('mapNoteTitle').textContent=t.mapNoteTitle;
document.getElementById('mapNoteText').textContent=t.mapNoteText;
document.getElementById('logoutButton').textContent=t.logout;
document.getElementById('homeButton').textContent=t.home;
document.getElementById('nextButton').textContent=t.next;
document.getElementById('bibleLink').textContent=t.bible;
document.getElementById('finalTitle').textContent=t.finalTitle;
document.getElementById('finalText').textContent=t.finalText;
document.getElementById('finalDate').textContent=t.finalDate;
document.getElementById('finalAddress').textContent=t.finalAddress;
document.getElementById('finalInvite').textContent=t.finalInvite;
if(currentUserData){
renderParticipantHome();
if(currentPoint!==null && currentPoint>=1 && currentPoint<=15 && currentPoint<=getCompleted()+1){
renderPoint(currentPoint);
}
}
}

// ============================================
// РЕГИСТРАЦИЯ И ВХОД
// ============================================
function switchMode(){
mode=mode==='register'?'login':'register';
document.getElementById('authForm').reset();
document.getElementById('message').textContent='';
setLanguage(currentLanguage);
}
function showError(error){
console.error(error);
const t=T[currentLanguage];
let code=error.code||'unknown';
if(code.includes('permission-denied'))code='permission-denied';
document.getElementById('message').textContent='Ошибка: '+(t.errors[code]||t.defaultError);
}
document.getElementById('authForm').addEventListener('submit',async e=>{
e.preventDefault();
const t=T[currentLanguage];
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const button=document.getElementById('submitButton');
button.disabled=true;
document.getElementById('message').textContent='';
try{
if(mode==='register'){
const fullName=document.getElementById('fullName').value.trim();
if(fullName.length<2){document.getElementById('message').textContent=currentLanguage==='ru'?'Введи имя и фамилию.':'Sisesta ees- ja perekonnanimi.';return;}
if(password!==document.getElementById('confirmPassword').value){document.getElementById('message').textContent=currentLanguage==='ru'?'Пароли не совпадают.':'Paroolid ei ühti.';return;}
const credential=await auth.createUserWithEmailAndPassword(email,password);
await db.collection('users').doc(credential.user.uid).set({
fullName,email:credential.user.email,language:currentLanguage,completedPoints:0,
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
}else{
await auth.signInWithEmailAndPassword(email,password);
}
}catch(error){showError(error);}
finally{button.disabled=false;}
});

// ============================================
// ПРОГРЕСС И КАРТА
// ============================================
function getCompleted(){
return Math.max(0,Math.min(15,Number(currentUserData?.completedPoints)||0));
}
function renderParticipantHome(){
if(!currentUserData)return;
const t=T[currentLanguage];
const completed=getCompleted();
document.getElementById('progressNumber').textContent=completed+' / 15';
document.getElementById('progressFill').style.width=(completed/15*100)+'%';
document.getElementById('welcomeTitle').textContent=t.welcome+(currentUserData.fullName?' '+currentUserData.fullName:'');
const grid=document.getElementById('starsGrid');
grid.innerHTML='';
const adventure=document.getElementById('adventure');
const story=document.getElementById('storyPanel');
const final=document.getElementById('finalPanel');
if(completed===15){
adventure.classList.add('hidden');
story.classList.add('hidden');
final.classList.remove('hidden');
currentPoint=null;
return;
}
final.classList.add('hidden');
if(currentPoint===null)story.classList.add('hidden');
adventure.classList.remove('hidden');
const next=completed+1;
const button=document.createElement('button');
button.type='button';
button.className='point';
button.innerHTML='<span class="point-symbol">✦</span><span class="point-number">'+String(next).padStart(2,'0')+'</span><span class="point-status">'+t.available+'</span>';
button.addEventListener('click',()=>openPoint(next));
grid.appendChild(button);
}

// ============================================
// ОТКРЫТИЕ QR И ИСТОРИЙ
// ============================================
function openPoint(number){
if(!currentUserData)return;
if(!Number.isInteger(number)||number<1||number>15)return;
if(number>getCompleted()+1){
document.getElementById('userMessage').textContent=currentLanguage==='ru'?'Эта звезда пока закрыта. Сначала пройди предыдущую.':'See täht on veel suletud. Läbi kõigepealt eelmine punkt.';
return;
}
renderPoint(number);
}
function renderPoint(number){
const p=POINTS[number-1];
if(!p)return;
currentPoint=number;
answerSubmitted=getCompleted()>=number;
const data=p[currentLanguage];
const t=T[currentLanguage];
document.getElementById('adventure').classList.add('hidden');
document.getElementById('finalPanel').classList.add('hidden');
document.getElementById('storyPanel').classList.remove('hidden');
document.getElementById('storyNumber').textContent=t.point+' '+String(number).padStart(2,'0')+' / 15';
document.getElementById('storyTitle').textContent=data.title;
document.getElementById('storyReference').textContent=p.ref;
document.getElementById('storyText').textContent=data.story;
document.getElementById('bibleLink').href='https://www.bible.com/search/bible?query='+encodeURIComponent(p.ref);
document.getElementById('questionText').textContent=data.q;
document.getElementById('hintBox').textContent=t.hint+': '+data.hint;
document.getElementById('hintBox').classList.add('hidden');
document.getElementById('explanationBox').textContent=data.explain;
document.getElementById('explanationBox').classList.toggle('hidden',!answerSubmitted);
document.getElementById('homeButton').classList.remove('hidden');
document.getElementById('nextButton').classList.toggle('hidden',!answerSubmitted);
const answers=document.getElementById('answers');
answers.innerHTML='';
data.a.forEach((answer,index)=>{
const btn=document.createElement('button');
btn.type='button';
btn.className='answer';
btn.textContent=String.fromCharCode(65+index)+'. '+answer;
if(answerSubmitted){
btn.disabled=true;
if(index===data.correct)btn.classList.add('correct');
}else{
btn.addEventListener('click',()=>checkAnswer(index));
}
answers.appendChild(btn);
});
if(!answerSubmitted){
const hintButton=document.createElement('button');
hintButton.type='button';
hintButton.className='secondary';
hintButton.textContent=currentLanguage==='ru'?'Показать подсказку':'Näita vihjet';
hintButton.onclick=()=>document.getElementById('hintBox').classList.remove('hidden');
answers.appendChild(hintButton);
}
}
async function checkAnswer(selected){
if(answerSubmitted||currentPoint===null)return;
const p=POINTS[currentPoint-1];
const data=p[currentLanguage];
const buttons=document.querySelectorAll('#answers .answer');
if(selected!==data.correct){
buttons[selected].classList.add('wrong');
document.getElementById('userMessage').textContent=T[currentLanguage].wrong;
document.getElementById('hintBox').classList.remove('hidden');
return;
}
buttons.forEach((button,index)=>{
button.disabled=true;
if(index===data.correct)button.classList.add('correct');
});
try{
const ref=db.collection('users').doc(auth.currentUser.uid);
const result=await db.runTransaction(async transaction=>{
const snap=await transaction.get(ref);
if(!snap.exists)throw new Error('profile-not-found');
const old=Math.max(0,Number(snap.data().completedPoints)||0);
const updated=Math.max(old,currentPoint);
if(updated!==old)transaction.update(ref,{completedPoints:updated});
return updated;
});
currentUserData.completedPoints=result;
answerSubmitted=true;
document.getElementById('explanationBox').textContent=data.explain;
document.getElementById('explanationBox').classList.remove('hidden');
document.getElementById('hintBox').classList.add('hidden');
document.getElementById('nextButton').classList.remove('hidden');
document.getElementById('userMessage').textContent=T[currentLanguage].correct;
renderParticipantHome();
if(currentPoint===15){
document.getElementById('storyPanel').classList.add('hidden');
document.getElementById('finalPanel').classList.remove('hidden');
}else{
document.getElementById('adventure').classList.add('hidden');
document.getElementById('storyPanel').classList.remove('hidden');
}
}catch(error){
console.error(error);
document.getElementById('userMessage').textContent=currentLanguage==='ru'?'Не удалось сохранить ответ. Проверь интернет и попробуй ещё раз.':'Vastuse salvestamine ebaõnnestus. Kontrolli internetti ja proovi uuesti.';
}
}
function showHome(){
currentPoint=null;
document.getElementById('storyPanel').classList.add('hidden');
document.getElementById('finalPanel').classList.add('hidden');
renderParticipantHome();
}
function handleQR(){
const params=new URLSearchParams(location.search);
const raw=params.get('point');
if(!raw)return;
const number=Number(raw);
if(!Number.isInteger(number)||number<1||number>15)return;
if(!currentUserData)return;
if(number<=getCompleted()+1)openPoint(number);
else document.getElementById('userMessage').textContent=currentLanguage==='ru'?'Эта звезда пока закрыта. Пройди предыдущие точки по порядку.':'See täht on veel suletud. Läbi eelmised punktid järjekorras.';
}

// ============================================
// ВОССТАНОВЛЕНИЕ ПРОФИЛЯ
// ============================================
auth.onAuthStateChanged(async user=>{
const authPanel=document.getElementById('authPanel');
const userPanel=document.getElementById('userPanel');
document.getElementById('userMessage').textContent='';
currentUserData=null;
currentPoint=null;
if(!user){
authPanel.classList.remove('hidden');
userPanel.classList.add('hidden');
return;
}
try{
const doc=await db.collection('users').doc(user.uid).get();
if(!doc.exists){
currentUserData={fullName:user.displayName||'',completedPoints:0};
document.getElementById('userMessage').textContent=currentLanguage==='ru'?'Профиль не найден. Обратись к организатору.':'Profiili ei leitud. Võta korraldajaga ühendust.';
}else{
currentUserData=doc.data();
}
document.getElementById('userEmail').textContent=user.email||'';
authPanel.classList.add('hidden');
userPanel.classList.remove('hidden');
renderParticipantHome();
handleQR();
}catch(error){
console.error(error);
document.getElementById('userMessage').textContent='Ошибка загрузки профиля: '+(error.code||error.message);
authPanel.classList.add('hidden');
userPanel.classList.remove('hidden');
}
});
async function logout(){
try{await auth.signOut();}
catch(error){showError(error);}
}
setLanguage(currentLanguage);
</script>
</body>
</html>
